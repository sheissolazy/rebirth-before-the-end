name: Deploy to GitHub Pages

# 同一个站点部署两个版本：
#   /       ← main 分支（稳定测试版）
#   /next/  ← next 分支（测试版二，存档前缀 rbte-next）
#   /dev/   ← dev 分支（最新开发版，存档前缀 rbte-dev）
# 只在 main 上运行（github-pages 环境只允许 main 部署）；next 推送时由 trigger-deploy.yml 触发这里。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: next
          path: next
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm test
          npm run build
      - name: Build next
        working-directory: next
        env:
          VITE_SAVE_PREFIX: rbte-next
        run: |
          npm ci
          npm test
          npm run build
      - name: Build dev
        working-directory: dev
        env:
          VITE_SAVE_PREFIX: rbte-dev
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site/next site/dev
          cp -r main/dist/. site/
          cp -r next/dist/. site/next/
          cp -r dev/dist/. site/dev/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
